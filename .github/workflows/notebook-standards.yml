name: Notebook Standards

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  standards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m unittest discover -s tests
